name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geodata
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geodata"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OGC_TEST_DSN: postgresql://postgres:postgres@localhost:5432/geodata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # The catalogue itself is committed: the study repositories are not available here, so it is checked, not rebuilt.
      - run: python -m pytest -q
