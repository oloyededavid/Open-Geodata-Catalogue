# Generated by scripts/build_service_config.py from docs/stac. Do not edit by hand; rebuild instead.
# pygeoapi replaces ${VAR:-default} with the environment variable VAR, or the default when it is not set.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages:
  - en-US
  cors: true
  pretty_print: true
  limits:
    default_items: 10
    max_items: 1000
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; OpenStreetMap contributors'
logging:
  level: ${PYGEOAPI_LOG_LEVEL:-ERROR}
metadata:
  identification:
    title: 'Open geodata catalogue: OGC API Features'
    description: Vector layers from David Oloyede's open studies, served from PostGIS. The same data are listed as a static
      STAC catalogue at https://oloyededavid.github.io/Open-Geodata-Catalogue/
    keywords:
    - STAC
    - OGC API Features
    - PostGIS
    - hydrology
    - Nigeria
    - Benin
    - Lake Chad
    - Mozambique
    keywords_type: theme
    terms_of_service: https://oloyededavid.github.io/Open-Geodata-Catalogue/
    url: https://github.com/oloyededavid/Open-Geodata-Catalogue
  license:
    name: 'Data: CC BY 4.0 unless a collection states otherwise; code: MIT'
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: David Oloyede
    url: https://github.com/oloyededavid
  contact:
    name: David Oloyede
    url: https://github.com/oloyededavid
    role: pointOfContact
